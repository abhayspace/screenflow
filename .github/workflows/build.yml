name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to upload release assets

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest      # Apple Silicon runner
            builder: --mac dmg --arm64
            artifact: ScreenFlow-mac-arm64.dmg
            pattern: dist/*.dmg
            sign: 'true'
          - os: macos-15-intel    # Intel runner (macos-13 retired)
            builder: --mac dmg --x64
            artifact: ScreenFlow-mac-x64.dmg
            pattern: dist/*.dmg
            sign: 'true'
          - os: windows-latest
            builder: --win nsis --x64
            artifact: ScreenFlow-windows.exe
            pattern: dist/*.exe
            sign: 'false'         # Developer ID cert is macOS-only; Windows stays unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer
        shell: bash
        run: |
          # macOS: sign + notarize when secrets exist. Import the cert into a
          # dedicated keychain ourselves (-A = any app may use the key, no
          # partition-list prompt) — electron-builder's own keychain handling
          # fails set-key-partition-list on newer runners. Windows and empty
          # secrets fall back to unsigned builds.
          if [ "${{ matrix.sign }}" = "true" ] && [ -n "$CSC_LINK" ]; then
            echo "$CSC_LINK" | base64 --decode > signing.p12
            security create-keychain -p "$CSC_KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$CSC_KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -t 3600 build.keychain
            security import signing.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -A
            security set-key-partition-list -S apple-tool:,apple: -s -k "$CSC_KEYCHAIN_PASSWORD" build.keychain || true
            rm signing.p12
            unset CSC_LINK CSC_KEYCHAIN_PASSWORD CSC_KEY_PASSWORD
          else
            unset CSC_LINK CSC_KEYCHAIN_PASSWORD CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEYCHAIN_PASSWORD: ${{ secrets.CSC_KEYCHAIN_PASSWORD }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Rename to stable filename
        shell: bash
        run: cp ${{ matrix.pattern }} "${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact }}" --clobber

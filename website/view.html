<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View on Web — ScreenFlow</title>
  <link rel="icon" href="assets/favicon.png?v=30" />
  <link rel="stylesheet" href="style.css?v=37" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" style="text-decoration:none">
      <img src="assets/logo.png?v=23" class="brand-icon" alt="ScreenFlow logo" />
      <span class="brand-name">SCREENFLOW</span>
    </a>
    <nav class="nav-pill">
      <a href="/">Home</a>
      <a href="share.html">Share on Web</a>
      <a href="view.html" class="active">View on Web</a>
    </nav>
    <div class="header-actions">
      <a class="btn primary" href="/">Download</a>
    </div>
  </header>

  <main class="page-wrap">
    <div class="page-card cast-card">
      <h1>View a screen</h1>
      <p class="cast-note">Works <b>over the internet</b> — on the sharing device (app or Share on Web), pick <b>Over the internet</b> and enter this code.</p>

      <div class="code-display" id="code-display">······</div>
      <p class="cast-status" id="v-status">Starting…</p>

      <div id="video-wrap" class="hidden">
        <video id="remote" autoplay playsinline class="remote-video"></video>
        <button class="cta-btn orange" id="btn-fullscreen">Fullscreen</button>
      </div>
    </div>
  </main>

  <script src="rtc.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const code = genCode6();
    $('code-display').textContent = code;
    let conn = null, pc = null;

    (async () => {
      $('v-status').textContent = 'Connecting…';
      try {
        conn = await sfConnect(code, 'viewer');
      } catch (e) {
        $('v-status').textContent = e.message;
        return;
      }
      $('v-status').textContent = 'Waiting for a device to share to this code…';

      conn.onSignal = async (from, data) => {
        if (data.sdp && data.sdp.type === 'offer') {
          pc = await sfViewerAnswer(conn, from, data.sdp, {
            onTrack: (s) => {
              $('remote').srcObject = s;
              $('video-wrap').classList.remove('hidden');
              $('v-status').textContent = 'Receiving stream…';
            },
            onState: (id, st) => {
              if (st === 'connected') $('v-status').textContent = 'Connected — receiving screen';
              else if (['failed', 'disconnected', 'closed'].includes(st)) $('v-status').textContent = `Connection ${st}`;
            },
          });
        } else if (data.candidate && pc) {
          try { await pc.addIceCandidate(data.candidate); } catch {}
        }
      };

      $('btn-fullscreen').onclick = () => {
        const el = document.getElementById('video-wrap');
        if (document.fullscreenElement) document.exitFullscreen();
        else el.requestFullscreen?.();
      };
      document.addEventListener('fullscreenchange', () => {
        const fs = !!document.fullscreenElement;
        $('btn-fullscreen').textContent = fs ? 'Minimize' : 'Fullscreen';
        $('btn-fullscreen').classList.toggle('orange', !fs);
        $('btn-fullscreen').classList.toggle('grey', fs);
      });

      conn.onPeerLeft = () => {
        pc?.close();
        pc = null;
        $('remote').srcObject = null;
        $('video-wrap').classList.add('hidden');
        $('v-status').textContent = 'Sharer disconnected — waiting…';
      };
    })();
  </script>
</body>
</html>
